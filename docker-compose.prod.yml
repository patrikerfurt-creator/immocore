services:
  db:
    image: postgres:16-alpine
    container_name: immocore_db
    env_file: .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    # Kein Port nach außen — nur intern erreichbar

  redis:
    image: redis:7-alpine
    container_name: immocore_redis
    restart: unless-stopped
    # Kein Port nach außen — nur intern erreichbar

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: immocore_backend
    env_file: .env.prod
    # Non-root: uid 1000 = Host-User patrik (Rechnungen-Eigentümer),
    # Zusatzgruppe 1001 = Host-Gruppe rechnung (Lesezugriff auf Uploader-Dateien).
    user: "1000:1000"
    group_add:
      - "1001"
    volumes:
      - backend_media:/app/media
      - backend_static:/app/staticfiles
      - ./CamtDAT:/app/camt_dat
      - ./Rechnungen:/app/rechnungen
    depends_on:
      - db
      - redis
    restart: unless-stopped

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: immocore_celery_worker
    command: celery -A config worker --loglevel=info --concurrency=2
    env_file: .env.prod
    # Non-root wie backend: uid 1000 (patrik) + Zusatzgruppe 1001 (rechnung).
    user: "1000:1000"
    group_add:
      - "1001"
    volumes:
      - backend_media:/app/media
      - ./CamtDAT:/app/camt_dat
      - ./Rechnungen:/app/rechnungen
    depends_on:
      - db
      - redis
    restart: unless-stopped

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: immocore_celery_beat
    # --schedule nach /tmp: PersistentScheduler-Statusdatei liegt garantiert
    # in einem für den non-root-User schreibbaren Pfad.
    command: celery -A config beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    env_file: .env.prod
    # Non-root wie backend: uid 1000 (patrik) + Zusatzgruppe 1001 (rechnung).
    user: "1000:1000"
    group_add:
      - "1001"
    volumes:
      - backend_media:/app/media
    depends_on:
      - db
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: immocore_frontend
    ports:
      - "8082:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  backend_media:
  backend_static:
