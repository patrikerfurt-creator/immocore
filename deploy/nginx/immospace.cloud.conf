# IMMOCORE — Eigentuemerportal unter immospace.cloud
#
# Ausgeliefert wird der Frontend-Container (127.0.0.1:8082). Das React-Bundle
# enthaelt AUCH die Mitarbeiter-Oberflaeche; die Trennung passiert hier:
# freigegeben sind ausschliesslich die Portal-Routen und die Portal-API.
#
# ACHTUNG beim Bearbeiten: /api/v1/portal/ MUSS den abschliessenden Slash
# behalten. Ohne ihn matcht der Block als Praefix auch
# /api/v1/portal-verwaltung/ — die Mitarbeiter-API zum Einladen und Sperren
# von Portalzugaengen (apps/portal/urls.py).
#
# Den TLS-Block ergaenzt certbot nach der DNS-Umstellung.

server {
    listen 80;
    listen [::]:80;
    server_name immospace.cloud www.immospace.cloud;

    access_log /var/log/nginx/immospace.access.log;
    error_log  /var/log/nginx/immospace.error.log;

    server_tokens off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Muss vor allen Redirects greifen (Zertifikatsausstellung/-erneuerung)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Kunden tippen die nackte Domain
    location = / {
        return 302 /portal/login;
    }
    location = /portal {
        return 302 /portal/login;
    }

    # --- Freigegeben: Portal-Oberflaeche ---
    location /portal/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Freigegeben: Bundle-Assets (Vite baut nach /assets/) ---
    location /assets/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
    }

    # --- Freigegeben: Portal-API (Slash beachten, siehe Kopf) ---
    location /api/v1/portal/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Gesperrt: interne API (inkl. /api/v1/portal-verwaltung/), Admin,
    #     Django-Static und Medien. Bewusst 404 statt Redirect. ---
    location /api/    { return 404; }
    location /admin/  { return 404; }
    location /static/ { return 404; }
    location /media/  { return 404; }

    # Alles Uebrige (Mitarbeiter-Routen der SPA) zurueck zum Portal-Login
    location / {
        return 302 /portal/login;
    }
}
